<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcus responsive preview</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#dce1e0;color:#172b30;font:13px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:14px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:white;border-bottom:1px solid #bac5c2}a{color:inherit}button,select{font:inherit;padding:7px;border:1px solid #bac5c2;border-radius:4px;background:white}label{display:flex;align-items:center;gap:8px}.stage{padding:22px;overflow:auto}iframe{display:block;border:0;margin:0 auto;background:white;height:calc(100vh - 120px);min-height:520px;box-shadow:0 2px 20px #172b3020}output{font-size:11px;color:#52605d}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #206e64;outline-offset:3px}
</style></head><body><header><strong>Responsive preview</strong><label>Direction <select id="direction"><option value="quiet">Quiet Operational</option><option value="editorial">Technical Editorial</option><option value="control">Control Room</option></select></label><label>Viewport <select id="size"><option value="390">iPhone · 390px</option><option value="768">iPad · 768px</option><option value="1280">Laptop · 1280px</option><option value="1440">Desktop · 1440px</option></select></label><a id="full" href="quiet/index.html">Open full size ↗</a><a href="acceptance.html">Layout checks</a><output id="result" aria-live="polite"></output></header><div class="stage"><iframe id="preview" title="Dashboard at selected viewport" src="quiet/index.html"></iframe></div><script>
const frame=document.querySelector('#preview'), direction=document.querySelector('#direction'), size=document.querySelector('#size');
const params=new URLSearchParams(location.search);
if(['quiet','editorial','control'].includes(params.get('direction')))direction.value=params.get('direction');
if(['390','768','1280','1440'].includes(params.get('width')))size.value=params.get('width');
function show(){frame.style.width=size.value+'px';frame.src=direction.value+'/index.html';document.querySelector('#full').href=frame.src;}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;document.querySelector('#result').textContent=doc.documentElement.clientWidth+'px viewport · '+(doc.documentElement.scrollWidth>doc.documentElement.clientWidth?'OVERFLOW':'no page overflow');});
direction.addEventListener('change',show);size.addEventListener('change',show);show();
</script></body></html>
