  <text x="40" y="804" class="t s">NWS / Alert Activity</text><text x="235" y="804" class="m sm">Recent severe-weather activity and geography</text>
  <g transform="translate(40 822)"><rect width="1500" height="136" rx="14" class="card"/><rect x="0" y="38" width="1500" height="28" class="tableHead"/><text x="20" y="27" class="t k">Recently Touched Alert Series</text><text x="20" y="57" class="m xs">TOUCHED</text><text x="180" y="57" class="m xs">EVENT</text><text x="510" y="57" class="m xs">GEOGRAPHY</text><text x="790" y="57" class="m xs">STATE</text><text x="960" y="57" class="m xs">TORNADO</text><text x="1190" y="57" class="m xs">DAMAGE THREAT</text><text x="20" y="89" class="t xs">6:11 PM</text><text x="180" y="89" class="t xs">Tornado Warning</text><text x="510" y="89" class="t xs">Weld / Morgan, CO</text><text x="790" y="89" class="good xs">active</text><text x="960" y="89" class="t xs">OBSERVED</text><text x="1190" y="89" class="warn xs">CONSIDERABLE</text><rect x="0" y="102" width="1500" height="28" class="rowAlt"/><text x="20" y="121" class="t xs">6:07 PM</text><text x="180" y="121" class="t xs">Severe Thunderstorm Warning</text><text x="510" y="121" class="t xs">Tarrant, TX</text><text x="790" y="121" class="good xs">active</text><text x="960" y="121" class="t xs">RADAR INDICATED</text><text x="1190" y="121" class="t xs">none</text></g>

