  <g transform="translate(410 1018)"><rect width="350" height="70" rx="14" class="card"/><text x="18" y="25" class="m sm">APNs success</text><text x="18" y="54" class="t s">98.4%</text></g>
  <g transform="translate(780 1018)"><rect width="350" height="70" rx="14" class="card"/><text x="18" y="25" class="m sm">Targetable coverage</text><text x="18" y="54" class="t s">61%</text></g>
