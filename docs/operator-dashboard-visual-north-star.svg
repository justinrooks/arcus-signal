<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Arcus Signal Operator Dashboard visual north star</title>
  <desc id="desc">Dark premium operator dashboard concept showing compact masthead, health cards, model pipeline, installation usage, NWS alert activity, delivery metrics, targeting, and diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071421"/><stop offset="1" stop-color="#04101a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132639"/><stop offset="1" stop-color="#0c1b2a"/></linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef6ff}.m{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8fa9be}.h{font-size:28px;font-weight:700}.s{font-size:22px;font-weight:700}.k{font-size:16px;font-weight:600}.v{font-size:28px;font-weight:700}.sm{font-size:13px}.xs{font-size:11px}.card{fill:url(#panel);stroke:#29445a;stroke-width:1}.line{stroke:#234057;stroke-width:1}.good{fill:#58d6c3}.warn{fill:#ffb15c}.bad{fill:#ff6f7d}.chip{fill:#113d3a;stroke:#2f8f82}.nav{fill:#091827;stroke:#29445a}.tableHead{fill:#0f2234}.rowAlt{fill:#0d1d2c}
    </style>
  </defs>
  <rect width="1600" height="1120" rx="22" fill="url(#bg)"/>
  <rect x="24" y="20" width="1552" height="76" rx="18" class="nav"/>
  <text x="52" y="56" class="t h">Arcus Signal</text><text x="52" y="79" class="m sm">Operational Dashboard</text>
  <text x="1170" y="57" class="good k">● LIVE</text><text x="1260" y="57" class="m sm">Snapshot 18s ago</text><text x="1440" y="57" class="t sm">JSON API ↗</text>

  <text x="40" y="132" class="t s">Red Lights</text><text x="178" y="132" class="m sm">Critical system health</text>
  <g transform="translate(40 150)"><rect width="360" height="110" rx="14" class="card"/><rect width="5" height="110" rx="3" class="good"/><text x="22" y="28" class="m k">Ingest Freshness</text><text x="22" y="69" class="t v">42s</text><circle cx="332" cy="25" r="5" class="good"/><text x="22" y="94" class="m xs">58 successes / 2 failures</text></g>
  <g transform="translate(420 150)"><rect width="360" height="110" rx="14" class="card"/><rect width="5" height="110" rx="3" class="warn"/><text x="22" y="28" class="m k">Pipeline Backlog Age</text><text x="22" y="69" class="warn v">3m 12s</text><circle cx="332" cy="25" r="5" class="warn"/><text x="22" y="94" class="m xs">7 target rows · 12 notification rows</text></g>
  <g transform="translate(800 150)"><rect width="360" height="110" rx="14" class="card"/><rect width="5" height="110" rx="3" class="good"/><text x="22" y="28" class="m k">Stuck Claimed Rows</text><text x="22" y="69" class="t v">0</text><circle cx="332" cy="25" r="5" class="good"/><text x="22" y="94" class="m xs">Threshold 5m</text></g>
  <g transform="translate(1180 150)"><rect width="360" height="110" rx="14" class="card"/><rect width="5" height="110" rx="3" class="warn"/><text x="22" y="28" class="m k">Stale Active Series</text><text x="22" y="69" class="warn v">2</text><circle cx="332" cy="25" r="5" class="warn"/><text x="22" y="94" class="m xs">Grace window 15m</text></g>

  <text x="40" y="304" class="t s">Model Pipeline</text><text x="201" y="304" class="m sm">GRIB readiness and artifact flow</text>
  <g transform="translate(40 322)"><rect width="360" height="104" rx="14" class="card"/><text x="20" y="26" class="m k">Pressure Artifact</text><rect x="20" y="48" width="84" height="28" rx="9" class="chip"/><text x="38" y="68" class="good k">READY</text><text x="128" y="55" class="t sm">Valid 5:00 PM</text><text x="128" y="76" class="m xs">HRRR 18z / F03 · checked 2m ago</text></g>
  <g transform="translate(420 322)"><rect width="360" height="104" rx="14" class="card"/><text x="20" y="26" class="m k">Catalog Summary</text><text x="20" y="62" class="t sm">Ready <tspan class="good">8</tspan> · Warming <tspan class="warn">1</tspan> · Pending 0 · Failed 0</text></g>
  <g transform="translate(800 322)"><rect width="740" height="104" rx="14" class="card"/><text x="20" y="26" class="m k">Recent Pressure Artifacts</text><line x1="20" y1="40" x2="720" y2="40" class="line"/><text x="22" y="59" class="m xs">Valid</text><text x="190" y="59" class="m xs">Run/FH</text><text x="310" y="59" class="m xs">Status</text><text x="430" y="59" class="m xs">Source</text><text x="560" y="59" class="m xs">Updated</text><text x="22" y="83" class="t xs">5:00 PM</text><text x="190" y="83" class="t xs">18z / F03</text><text x="310" y="83" class="good xs">READY</text><text x="430" y="83" class="t xs">HRRR</text><text x="560" y="83" class="t xs">2m ago</text></g>

  <text x="40" y="470" class="t s">Installations / Usage</text><text x="250" y="470" class="m sm">Growth, engagement, and operational footprint</text>
