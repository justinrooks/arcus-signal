x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  VAPOR_ENV: ${VAPOR_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:-postgres://arcus:arcus@postgres:5432/arcus_signal}
  DATABASE_HOST: ${DATABASE_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_USERNAME: ${DATABASE_USERNAME:-arcus}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-arcus}
  DATABASE_NAME: ${DATABASE_NAME:-arcus_signal}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  QUEUE_WORKER_COUNT: ${QUEUE_WORKER_COUNT:-1}
  REDIS_POOL_MAX_CONNECTIONS: ${REDIS_POOL_MAX_CONNECTIONS:-8}
  REDIS_POOL_CONNECTION_TIMEOUT_SECONDS: ${REDIS_POOL_CONNECTION_TIMEOUT_SECONDS:-30}
  WORKER_STARTUP_GRACE_SECONDS: ${WORKER_STARTUP_GRACE_SECONDS:-5}

services:
  api:
    image: ghcr.io/justinrooks/arcus-signal:latest
    build:
      context: .
      args:
        SWIFT_VERSION: ${SWIFT_VERSION:-6.3.0}
    environment:
      <<: *shared_environment
      STORM_SETUP_WGRIB2_PATH: ${STORM_SETUP_WGRIB2_PATH:-/usr/local/bin/wgrib2}
      STORM_SETUP_CACHE_ROOT: ${STORM_SETUP_CACHE_ROOT:-/app/storage/storm-setup}
      ARCUS_DEBUG_ENDPOINTS_ENABLED: "true"
      ANVIL_PROFILE_ANALYSIS_BASE_URL: ${ANVIL_PROFILE_ANALYSIS_BASE_URL:-http://host.docker.internal:8089/api}
      ANVIL_PROFILE_ANALYSIS_TIMEOUT_SECONDS: "10"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8080:8080'
    volumes:
      - ./Fixtures:/app/Fixtures:ro
      - storm_setup_cache:/app/storage/storm-setup
    command: [ "./Run", "serve", "--env", "${VAPOR_ENV:-production}", "--hostname", "0.0.0.0", "--port", "8080" ]

  worker:
    image: ghcr.io/justinrooks/arcus-signal:latest
    build:
      context: .
      args:
        SWIFT_VERSION: ${SWIFT_VERSION:-6.3.0}
    environment:
      <<: *shared_environment
      STORM_SETUP_CACHE_ROOT: ${STORM_SETUP_CACHE_ROOT:-/app/storage/storm-setup}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.skyaware.app}
      APNS_SANDBOX_KEY_ID: ${APNS_SANDBOX_KEY_ID:-}
      APNS_SANDBOX_PRIVATE_KEY_PATH: ${APNS_SANDBOX_PRIVATE_KEY_PATH:-/run/secrets/apns/AuthKey-sandbox.p8}
      APNS_PROD_KEY_ID: ${APNS_PROD_KEY_ID:-}
      APNS_PROD_PRIVATE_KEY_PATH: ${APNS_PROD_PRIVATE_KEY_PATH:-/run/secrets/apns/AuthKey-prod.p8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8081:8081'
    volumes:
      - ./Fixtures:/app/Fixtures:ro
      - storm_setup_cache:/app/storage/storm-setup
      - ${APNS_SANDBOX_P8_HOST_PATH:-./.secrets/apns/AuthKey-sandbox.p8}:${APNS_SANDBOX_PRIVATE_KEY_PATH:-/run/secrets/apns/AuthKey-sandbox.p8}:ro
      - ${APNS_PROD_P8_HOST_PATH:-./.secrets/apns/AuthKey-prod.p8}:${APNS_PROD_PRIVATE_KEY_PATH:-/run/secrets/apns/AuthKey-prod.p8}:ro
    command: [ "./RunWorker", "serve", "--env", "${VAPOR_ENV:-production}", "--hostname", "0.0.0.0", "--port", "8081" ]

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-arcus}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-arcus}
      POSTGRES_DB: ${DATABASE_NAME:-arcus_signal}
    restart: unless-stopped
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-arcus} -d ${DATABASE_NAME:-arcus_signal}" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  storm_setup_cache:
